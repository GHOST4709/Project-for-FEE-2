<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge — Rooms & PG</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (localStorage.getItem('bridge_logged_in') !== 'true') {
                window.location.replace('login.html');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="rail" aria-hidden="true"></div>

    <header class="site-header dashboard-header">
        <a href="index.html" class="brand">
            <span class="brand-mark">⚡</span>
            <span class="brand-word">BRIDGE<em>.</em></span>
        </a>
        <div class="user-menu">
            <a href="dashboard.html" class="btn btn-ghost btn-sm">← Back to Dashboard</a>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode">
                <span id="theme-icon">🌙</span>
                <span id="theme-label">Dark</span>
            </button>
            <div class="user-badge" id="user-badge" title="Alex Rivera">AR</div>
            <button id="logout-btn" class="btn btn-ghost btn-sm">Log out</button>
        </div>
    </header>

    <main class="rooms-container">
        <!-- Page Header -->
        <section class="rooms-head">
            <p class="section-eyebrow">02 / CAMPUS HOUSING</p>
            <h1>Find Your Perfect Space</h1>
            <p class="rooms-sub">Discover top-rated PGs, shared rooms, and private apartments near your campus.</p>
        </section>

        <!-- Search & Filters Container -->
        <div class="rooms-filter-section">
            <div class="rooms-search-card">
                <div class="rooms-search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="housing-search" placeholder="Search by location or name..." oninput="filterRooms()">
                </div>
                <div class="filter-dropdowns">
                    <select id="filter-price" onchange="filterRooms()">
                        <option value="all">Price Range</option>
                        <option value="low">Under ₹8,000</option>
                        <option value="mid">₹8,000 - ₹12,000</option>
                        <option value="high">Above ₹12,000</option>
                    </select>
                    <select id="filter-type" onchange="filterRooms()">
                        <option value="all">Room Type</option>
                        <option value="Boys Only">Boys Only</option>
                        <option value="Girls Only">Girls Only</option>
                        <option value="Co-ed">Co-ed</option>
                    </select>
                </div>
            </div>

            <!-- Quick Amenity Pills -->
            <div class="pill-filters">
                <button class="pill-btn" data-amenity="Wi-Fi" onclick="togglePill(this)">📶 Wi-Fi</button>
                <button class="pill-btn" data-amenity="AC" onclick="togglePill(this)">❄️ AC Rooms</button>
                <button class="pill-btn" data-amenity="Meals" onclick="togglePill(this)">🍱 Food Included</button>
                <button class="pill-btn" data-amenity="Laundry" onclick="togglePill(this)">🧺 Laundry</button>
            </div>
        </div>

        <!-- Room Listings Grid -->
        <div id="rooms-list-container" class="rooms-list"></div>
    </main>

    <footer class="site-footer">
        <p>© 2026 Bridge Network. Connected Campus Experience.</p>
        <p><a href="dashboard.html">← Back to Dashboard</a></p>
    </footer>

    <div id="toast" class="toast">Theme updated!</div>
    <script src="script.js"></script>
    <script>
        // Mock Housing Database
        const roomsDatabase = [
            {
                id: 1,
                title: "Student Haven PG",
                image: "https://images.unsplash.com/photo-1555854877-bab0e564b8d5?auto=format&fit=crop&w=600&q=80",
                rating: 4.8,
                price: 8500,
                distance: "1.2 km from North Campus",
                gender: "Boys Only",
                sharingTag: "Double Sharing",
                amenities: ["Wi-Fi", "Meals", "AC"]
            },
            {
                id: 2,
                title: "Elite Scholars Residence",
                image: "https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?auto=format&fit=crop&w=600&q=80",
                rating: 4.5,
                price: 14000,
                distance: "0.5 km from Main Gate",
                gender: "Co-ed",
                sharingTag: "Private Room",
                amenities: ["Wi-Fi", "Gym", "Laundry"]
            },
            {
                id: 3,
                title: "Campus View Hostel",
                image: "https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?auto=format&fit=crop&w=600&q=80",
                rating: 4.2,
                price: 6000,
                distance: "2.5 km from South Campus",
                gender: "Girls Only",
                sharingTag: "Triple Sharing",
                amenities: ["Wi-Fi", "Meals"]
            }
        ];

        let activePills = new Set();

        function renderRooms(rooms) {
            const container = document.getElementById('rooms-list-container');
            container.innerHTML = '';

            if (!rooms || rooms.length === 0) {
                container.innerHTML = `
                    <div class="no-rides-card">
                        <span class="no-rides-icon">🏠</span>
                        <h3>No Properties Found</h3>
                        <p>No listings match your current filters. Try resetting your search terms.</p>
                        <button class="btn btn-ghost btn-sm" onclick="resetRoomFilters()">Reset Filters</button>
                    </div>
                `;
                return;
            }

            rooms.forEach(room => {
                const card = document.createElement('article');
                card.className = 'room-card';
                card.innerHTML = `
                    <div class="room-media">
                        <img src="${room.image}" alt="${room.title}" class="room-img">
                        <span class="room-rating-badge">★ ${room.rating}</span>
                        <button class="fav-btn" onclick="toggleFav(this)" aria-label="Save Property">🤍</button>
                    </div>
                    <div class="room-details">
                        <div class="room-header-row">
                            <div>
                                <h3 class="room-title">${room.title}</h3>
                                <p class="room-meta">📍 ${room.distance} • <strong>${room.gender}</strong></p>
                            </div>
                            <div class="room-price-wrap">
                                <span class="room-price">₹${room.price.toLocaleString()}</span>
                                <span class="room-period">/ month</span>
                            </div>
                        </div>

                        <div class="room-tags">
                            ${room.amenities.map(a => `<span class="room-tag">${a}</span>`).join('')}
                        </div>

                        <div class="room-footer-row">
                            <span class="badge badge-amber">${room.sharingTag}</span>
                            <button class="btn btn-ghost btn-sm" onclick="showToast('Contacting ${room.title} owner...')">View Details</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function togglePill(btn) {
            const amenity = btn.getAttribute('data-amenity');
            if (activePills.has(amenity)) {
                activePills.delete(amenity);
                btn.classList.remove('active');
            } else {
                activePills.add(amenity);
                btn.classList.add('active');
            }
            filterRooms();
        }

        function toggleFav(btn) {
            if (btn.textContent === '🤍') {
                btn.textContent = '❤️';
                showToast('Saved to your favorites!');
            } else {
                btn.textContent = '🤍';
                showToast('Removed from favorites');
            }
        }

        function filterRooms() {
            const query = document.getElementById('housing-search').value.toLowerCase();
            const priceRange = document.getElementById('filter-price').value;
            const genderType = document.getElementById('filter-type').value;

            const filtered = roomsDatabase.filter(room => {
                const matchesQuery = room.title.toLowerCase().includes(query) || room.distance.toLowerCase().includes(query);
                const matchesGender = genderType === 'all' || room.gender === genderType;
                
                let matchesPrice = true;
                if (priceRange === 'low') matchesPrice = room.price < 8000;
                else if (priceRange === 'mid') matchesPrice = room.price >= 8000 && room.price <= 12000;
                else if (priceRange === 'high') matchesPrice = room.price > 12000;

                let matchesPills = true;
                activePills.forEach(amenity => {
                    if (!room.amenities.includes(amenity)) matchesPills = false;
                });

                return matchesQuery && matchesGender && matchesPrice && matchesPills;
            });

            renderRooms(filtered);
        }

        function resetRoomFilters() {
            document.getElementById('housing-search').value = '';
            document.getElementById('filter-price').value = 'all';
            document.getElementById('filter-type').value = 'all';
            activePills.clear();
            document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
            renderRooms(roomsDatabase);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderRooms(roomsDatabase);
        });
    </script>
</body>
</html>
